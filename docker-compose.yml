# Staging: the full stack on Docker Desktop, using the same image production deploys.
#   make staging/up              binary built by make, packaged into the image
#   docker compose up --build    reviewers without Go/make: compiles inside Docker
# Order: postgres (healthy) -> migrate (runs once, exits 0) -> api
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-zemi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-zemi_dev_password}
      POSTGRES_DB: ${DB_NAME:-zemi_fleet}
    ports:
      - "${STAGING_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 forces TCP: during first-run init Postgres only listens on a unix socket,
      # so a socket check goes healthy too early and migrate hits "connection refused".
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.1
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${DB_USER:-zemi}:${DB_PASSWORD:-zemi_dev_password}@postgres:5432/${DB_NAME:-zemi_fleet}?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      # `make staging/up` sets prebuilt (binary built by make); plain
      # `docker compose up --build` compiles inside Docker instead.
      target: ${API_BUILD_TARGET:-runtime}
      args:
        VERSION: ${VERSION:-docker}
    image: zemi-fleet-api:staging
    environment:
      APP_ENV: staging
      PORT: 4000
      DATABASE_URL: postgres://${DB_USER:-zemi}:${DB_PASSWORD:-zemi_dev_password}@postgres:5432/${DB_NAME:-zemi_fleet}?sslmode=disable
      APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Nairobi}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-25}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-2}
      DB_MAX_CONN_IDLE_TIME: ${DB_MAX_CONN_IDLE_TIME:-15m}
      DB_QUERY_TIMEOUT: ${DB_QUERY_TIMEOUT:-3s}
      RIDER_PAYOUT_BPS: ${RIDER_PAYOUT_BPS:-9000}
      CONE_RADIUS_KM: ${CONE_RADIUS_KM:-1}
      CONE_HALF_ANGLE_DEG: ${CONE_HALF_ANGLE_DEG:-30}
      CONE_MIN_SPEED_KMH: ${CONE_MIN_SPEED_KMH:-3}
      CONE_MAX_RESULTS: ${CONE_MAX_RESULTS:-20}
      BATCH_MAX_ORDERS: ${BATCH_MAX_ORDERS:-5}
      BATCH_PICKUP_RADIUS_KM: ${BATCH_PICKUP_RADIUS_KM:-2}
      BATCH_DIRECTION_TOLERANCE_DEG: ${BATCH_DIRECTION_TOLERANCE_DEG:-45}
      BATCH_SEARCH_RADIUS_KM: ${BATCH_SEARCH_RADIUS_KM:-5}
      BATCH_VISIBILITY_RADIUS_KM: ${BATCH_VISIBILITY_RADIUS_KM:-3}
      ORDER_MIN_TRIP_M: ${ORDER_MIN_TRIP_M:-50}
      ORDER_MAX_VALUE_KES: ${ORDER_MAX_VALUE_KES:-10000000}
      ORDER_MAX_DELIVERY_FEE_KES: ${ORDER_MAX_DELIVERY_FEE_KES:-10000000}
      IDEMPOTENCY_TTL: ${IDEMPOTENCY_TTL:-24h}
      IDEMPOTENCY_PROCESSING_TIMEOUT: ${IDEMPOTENCY_PROCESSING_TIMEOUT:-2m}
      MATCH_MAX_DISTANCE_KM: ${MATCH_MAX_DISTANCE_KM:-10}
      RIDER_LOCATION_STALE_AFTER: ${RIDER_LOCATION_STALE_AFTER:-30m}
      MATCH_WEIGHT_CATEGORY: ${MATCH_WEIGHT_CATEGORY:-0.25}
      MATCH_WEIGHT_AREA: ${MATCH_WEIGHT_AREA:-0.20}
      MATCH_WEIGHT_PROXIMITY: ${MATCH_WEIGHT_PROXIMITY:-0.35}
      MATCH_WEIGHT_ACCEPTANCE: ${MATCH_WEIGHT_ACCEPTANCE:-0.20}
      MATCH_MAX_RESULTS: ${MATCH_MAX_RESULTS:-10}
      BATCH_TTL: ${BATCH_TTL:-10m}
      AVG_SPEED_KMH: ${AVG_SPEED_KMH:-20}
      STOP_DWELL_MIN: ${STOP_DWELL_MIN:-2}
    ports:
      - "${STAGING_API_PORT:-8080}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:4000/api/v2/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
